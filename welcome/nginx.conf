server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `always` so these still apply to 404s and other error responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Nothing here is content-hashed, so HTML is revalidated on every request:
    # a corrected privacy policy has to be live the moment it is redeployed,
    # not whenever a cached copy happens to expire. Assets override this below.
    #
    # Set with `expires` rather than `add_header Cache-Control`, deliberately:
    # an `add_header` in a location block replaces the whole inherited set, so
    # doing it that way would silently drop the three security headers above
    # from every asset response. `expires` carries no such rule.
    expires -1;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        # `$uri/index.html` is tried before `$uri/` so that /privacy-policy is
        # served directly. Without it nginx matches the directory and answers
        # with a 301 to /privacy-policy/, which is a wasted round trip and
        # leaves the canonical URL looking different from the one we publish.
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Fonts, the logo and the screenshots. Filenames carry no hash, so this is
    # a month rather than a year — long enough to be worth caching, short
    # enough that replacing an image doesn't strand old copies indefinitely.
    location ~* \.(?:svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 30d;
    }
}
