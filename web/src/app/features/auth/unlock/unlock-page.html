<!--
  One spartan card per step of the flow, sized against the layout column rather
  than its own content, so moving between steps doesn't move the surface.
  See SPARTAN.md.
-->
<form
  hlmCard
  class="animate-in fade-in slide-in-from-bottom-4 mx-auto w-full max-w-100 duration-700"
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
>
  <div hlmCardHeader>
    <h1 hlmCardTitle>Unlock your vault</h1>
    <p hlmCardDescription>Enter your secret to unlock your vault.</p>
  </div>

  <div hlmCardContent class="flex flex-col gap-4">
    <hlm-field>
      <label hlmFieldLabel for="unlock-email">Email address</label>
      <hlm-input-group>
        <input
          hlmInputGroupInput
          id="unlock-email"
          type="email"
          formControlName="email"
          readonly
        />
        <hlm-input-group-addon align="inline-end">
          <!-- Abandons this sign-in, same action as the sidebar's own "Disconnect". -->
          <button
            hlmInputGroupButton
            type="button"
            size="icon-xs"
            aria-label="Disconnect"
            (click)="disconnect()"
          >
            <app-icon name="disconnect" />
          </button>
        </hlm-input-group-addon>
      </hlm-input-group>
    </hlm-field>

    <div hlmField>
      <label hlmFieldLabel for="unlock-secret">Secret</label>

      <hlm-input-group>
        <input
          hlmInputGroupInput
          id="unlock-secret"
          formControlName="secret"
          [type]="revealed() ? 'text' : 'password'"
          autocomplete="current-password"
          autofocus
          (focus)="selectAll($event)"
        />
        <hlm-input-group-addon align="inline-end">
          <button
            hlmInputGroupButton
            size="icon-xs"
            [attr.aria-label]="revealed() ? 'Hide secret' : 'Show secret'"
            [attr.aria-pressed]="revealed()"
            (click)="toggleRevealed()"
          >
            <app-icon [name]="revealed() ? 'hide' : 'show'" />
          </button>
        </hlm-input-group-addon>
      </hlm-input-group>
    </div>

    @if (errorMessage()) {
      <!-- Two columns by hand: see the note on the same alert in `start-page.html`. -->
      <div hlmAlert variant="destructive" class="grid-cols-[auto_1fr] gap-x-2.5!">
        <app-icon name="alert" class="translate-y-0.5" />
        <p hlmAlertDescription>{{ errorMessage() }}</p>
      </div>
    }
  </div>

  <div hlmCardFooter class="flex-col gap-2">
    <button
      hlmBtn
      type="submit"
      class="w-full"
      [variant]="hasSecret() ? 'default' : 'secondary'"
      [disabled]="!hasSecret() || submitting()"
    >
      @if (submitting()) {
        <hlm-spinner />
      } @else {
        <app-icon name="unlock" />
      }
      Unlock
    </button>

    <button
      hlmBtn
      type="button"
      variant="ghost"
      size="sm"
      class="text-muted-foreground w-full"
      (click)="openReset()"
    >
      Forgot your secret?
    </button>
  </div>
</form>
