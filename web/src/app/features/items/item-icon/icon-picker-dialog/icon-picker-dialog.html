<hlm-dialog [state]="open() ? 'open' : 'closed'" (stateChanged)="open.set($event === 'open')">
  <hlm-dialog-content *hlmDialogPortal class="w-[min(32rem,calc(100vw-2rem))] gap-6 rounded-2xl sm:max-w-lg" [attr.aria-label]="'items.iconPicker.title' | t">
    <hlm-dialog-header class="gap-1.5">
      <span
        class="bg-primary/15 text-accent-strong ring-primary/25 mb-2 inline-flex size-12 items-center justify-center rounded-2xl ring-1"
        aria-hidden="true"
      >
        <ng-icon name="lucideShapes" size="1.375rem" strokeWidth="1.75" />
      </span>
      <h3 hlmDialogTitle class="text-lg font-bold">{{ 'items.iconPicker.title' | t }}</h3>
      <p hlmDialogDescription>{{ 'items.iconPicker.description' | t }}</p>
    </hlm-dialog-header>

    <input
      hlmInput
      #searchInput
      class="w-full bg-card h-11 rounded-xl"
      [placeholder]="'items.iconPicker.searchPlaceholder' | t"
      autocomplete="off"
      [value]="search()"
      (input)="onSearch($any($event.target).value)"
    />

    <!--
      Tiles rather than a list, same reasoning as the create-item template
      picker: this is a grid of visual choices, not text rows.
    -->
    <div
      class="grid max-h-[50vh] grid-cols-4 gap-2 overflow-y-auto p-0.5 sm:grid-cols-6"
      role="listbox"
      [attr.aria-label]="'items.list.searchItemsAria' | t"
    >
      @for (icon of results(); track icon.name) {
        <button
          type="button"
          class="border-input bg-card hover:bg-accent hover:text-accent-strong focus-visible:ring-ring/50 flex cursor-pointer flex-col items-center gap-1 rounded-lg border px-1 py-2 text-center transition-colors focus-visible:ring-2 focus-visible:outline-none"
          [attr.title]="icon.label"
          (click)="select(icon)"
        >
          <app-icon [codePoint]="icon.unicode" class="text-lg" />
          <span class="w-full truncate text-[0.65rem] leading-tight">{{ icon.label }}</span>
        </button>
      } @empty {
        <p class="text-muted-foreground col-span-full py-8 text-center text-sm">
          {{ 'items.iconPicker.noResults' | t: { search: search() } }}
        </p>
      }
    </div>

    <hlm-dialog-footer class="gap-2">
      <button hlmBtn class="h-10 rounded-xl px-4 font-semibold" variant="ghost" (click)="useDefault()">{{ 'items.iconPicker.useDefault' | t }}</button>
      <button hlmBtn class="h-10 rounded-xl px-4 font-semibold" variant="outline" (click)="cancel()">{{ 'common.cancel' | t }}</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
