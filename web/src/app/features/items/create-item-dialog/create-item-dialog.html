<!--
  Driven from the `open` model rather than a trigger button: the thing that opens
  this is the list header's "New item" action, which lives in another component.
-->
<hlm-dialog [state]="open() ? 'open' : 'closed'" (stateChanged)="open.set($event === 'open')">
  <hlm-dialog-content *hlmDialogPortal class="w-[min(32rem,calc(100vw-2rem))] gap-6 rounded-2xl sm:max-w-lg" [attr.aria-label]="'items.createItem.title' | t">
    <hlm-dialog-header class="gap-1.5">
      <span
        class="bg-primary/15 text-accent-strong ring-primary/25 mb-2 inline-flex size-12 items-center justify-center rounded-2xl ring-1"
        aria-hidden="true"
      >
        <ng-icon name="lucideFilePlus2" size="1.375rem" strokeWidth="1.75" />
      </span>
      <h3 hlmDialogTitle class="text-lg font-bold">{{ 'items.createItem.title' | t }}</h3>
      <p hlmDialogDescription>{{ 'items.createItem.description' | t }}</p>
    </hlm-dialog-header>

    <hlm-field>
      <label hlmFieldLabel for="create-item-vault">{{ 'items.createItem.vaultLabel' | t }}</label>
      <hlm-select
        id="create-item-vault"
        [formControl]="vaultControl"
        [itemToString]="vaultOptionLabel"
      >
        <hlm-select-trigger class="bg-card h-11 w-full rounded-xl px-3.5">
          <hlm-select-value [placeholder]="'items.selectVaultPlaceholder' | t" />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (option of vaultOptions(); track option.value) {
            <hlm-select-item [value]="option.value">{{ option.label }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </hlm-field>

    <!--
      The template decides which fields the new item starts with, so it is picked
      here rather than after the fact.

      Tiles rather than `hlmItem` rows: a type picker is a grid of choices, not a
      list, and a plain button takes `border-primary` and `bg-primary/5` for the
      selected state without fighting a helm variant's own `border-border` for
      stylesheet order. `aria-pressed` is both the state and what styles it.
    -->
    <hlm-field>
      <span hlmFieldLabel id="create-item-type">{{ 'items.createItem.itemType' | t }}</span>
      <div
        class="template-grid grid max-h-[45vh] grid-cols-2 gap-2 overflow-y-auto p-0.5 sm:grid-cols-3"
        role="group"
        aria-labelledby="create-item-type"
      >
        @for (template of templates; track template.id) {
          <button
            type="button"
            class="template border-border bg-card hover:bg-muted focus-visible:ring-ring/50 aria-pressed:border-primary aria-pressed:bg-primary/10 aria-pressed:text-accent-strong aria-pressed:ring-primary/30 flex cursor-pointer flex-col items-center gap-2 rounded-xl border px-2 py-3.5 text-center transition-colors aria-pressed:ring-1 focus-visible:ring-2 focus-visible:outline-none"
            [attr.aria-pressed]="isSelected(template)"
            (click)="selectTemplate(template)"
          >
            <app-icon [name]="glyphFor(template)" class="text-xl" />
            <span class="text-xs leading-tight">{{ template.labelKey | t }}</span>
          </button>
        }
      </div>
    </hlm-field>

    <hlm-dialog-footer class="gap-2">
      <button hlmBtn class="h-10 rounded-xl px-4 font-semibold" variant="outline" (click)="cancel()">{{ 'common.cancel' | t }}</button>
      <button hlmBtn class="h-10 gap-2 rounded-xl px-4 font-bold" [disabled]="!canCreate()" (click)="create()">{{ 'common.create' | t }}</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
