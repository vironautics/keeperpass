<!--
  Driven from the `open` model rather than a trigger: what opens this is the sidebar's
  "New vault" action or the vaults page header, both in other components.
-->
<hlm-dialog [state]="open() ? 'open' : 'closed'" (stateChanged)="open.set($event === 'open')">
  <hlm-dialog-content *hlmDialogPortal class="sm:max-w-sm" [attr.aria-label]="'vaults.createVault.title' | t">
    <hlm-dialog-header>
      <h3 hlmDialogTitle>{{ 'vaults.createVault.title' | t }}</h3>
      <p hlmDialogDescription>
        {{ 'vaults.createVault.description' | t }}
      </p>
    </hlm-dialog-header>

    <hlm-field>
      <label hlmFieldLabel for="create-vault-name">{{ 'vaults.nameLabel' | t }}</label>
      <input
        hlmInput
        id="create-vault-name"
        class="create-input w-full"
        [formControl]="nameControl"
        autocomplete="off"
        (keydown.enter)="create()"
      />
      @if (nameIsDuplicate()) {
        <hlm-field-error forceShow>{{ 'vaults.duplicateError' | t }}</hlm-field-error>
      }
    </hlm-field>

    <hlm-dialog-footer>
      <button hlmBtn variant="outline" (click)="cancel()">{{ 'common.cancel' | t }}</button>
      <button hlmBtn [disabled]="!canCreate()" (click)="create()">{{ 'common.create' | t }}</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
