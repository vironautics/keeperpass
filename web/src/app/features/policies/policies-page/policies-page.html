<header class="bg-card flex h-14 shrink-0 items-center gap-3 border-b px-3 sm:px-6">
  <!--
    The sidebar is a sheet below `md`, so it needs one obvious way in. From `md` up the
    sidebar column is permanently on screen and its own header owns the toggle.
  -->
  <button
    hlmSidebarTrigger
    class="-ms-1 size-9 rounded-lg md:hidden"
    [srOnlyText]="'common.openNavMenu' | t"
  ></button>

  <span
    class="bg-primary/15 text-accent-strong inline-flex size-9 shrink-0 items-center justify-center rounded-xl"
    aria-hidden="true"
  >
    <ng-icon name="lucideScale" size="1.125rem" strokeWidth="1.75" />
  </span>

  <div class="flex min-w-0 flex-1 flex-col leading-tight">
    <h1 class="text-foreground truncate text-base font-extrabold tracking-tight">
      {{ 'policies.title' | t }}
    </h1>
    <p class="text-muted-foreground truncate text-xs max-sm:hidden">{{ 'policies.subtitle' | t }}</p>
  </div>
</header>

<!--
  Two documents behind one segmented control, in a reading column: legal text at full
  window width is 200 characters a line and nobody reads it.

  `hlm-tabs` owns which one is showing; `activeTab` mirrors it so the component (and its
  spec) can still ask and set.
-->
<main class="bg-background min-h-0 flex-1 overflow-y-auto">
  <div class="mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 sm:py-8">
    <hlm-tabs [tab]="activeTab()" (tabActivated)="onTabActivated($event)">
      <hlm-tabs-list
        class="tab-nav bg-muted w-full rounded-xl p-1 group-data-horizontal/tabs:h-11"
        [attr.aria-label]="'policies.title' | t"
      >
        @for (doc of documents; track doc.tab) {
          <button
            [hlmTabsTrigger]="doc.tab"
            class="tab-button data-active:bg-card dark:data-active:bg-card h-9 flex-1 gap-2 rounded-lg border-0 font-semibold data-active:shadow-xs"
          >
            <ng-icon [name]="doc.icon" size="1rem" strokeWidth="1.75" />
            {{ doc.title | t }}
          </button>
        }
      </hlm-tabs-list>

      @for (doc of documents; track doc.tab) {
        <div [hlmTabsContent]="doc.tab" class="tab-content">
          <article class="bg-card mt-5 overflow-hidden rounded-2xl border shadow-xs">
            <div class="flex items-start gap-4 p-5 sm:p-7">
              <span
                class="bg-primary/15 text-accent-strong inline-flex size-12 shrink-0 items-center justify-center rounded-2xl"
                aria-hidden="true"
              >
                <ng-icon [name]="doc.icon" size="1.375rem" strokeWidth="1.75" />
              </span>
              <div class="flex min-w-0 flex-col gap-2">
                <h2 class="text-foreground text-xl font-extrabold tracking-tight">
                  {{ doc.title | t }}
                </h2>
                <p class="text-muted-foreground text-[0.9375rem] leading-relaxed">
                  {{ doc.body | t }}
                </p>
              </div>
            </div>

            <!--
              The document itself lives on the website, so the way to it is the one thing
              on this card that matters: a full-width link that says where it goes.
            -->
            <div class="bg-muted/40 border-t p-3 sm:p-4">
              <a
                [href]="doc.href"
                target="_blank"
                rel="noopener"
                class="group bg-card hover:border-primary/50 focus-visible:ring-ring/50 flex items-center gap-3 rounded-xl border px-4 py-3 transition-colors outline-none focus-visible:ring-3"
              >
                <ng-icon
                  name="lucideGlobe"
                  size="1.125rem"
                  strokeWidth="1.75"
                  class="text-muted-foreground shrink-0"
                />
                <span class="flex min-w-0 flex-1 flex-col">
                  <span class="text-muted-foreground text-xs">{{ 'policies.linkPrefix' | t }}</span>
                  <span class="text-accent-strong truncate text-sm font-bold">{{ doc.label }}</span>
                </span>
                <span class="text-muted-foreground flex shrink-0 items-center gap-1.5 text-xs max-sm:hidden">
                  {{ 'policies.opensNewTab' | t }}
                </span>
                <ng-icon
                  name="lucideExternalLink"
                  size="1rem"
                  strokeWidth="2"
                  class="text-muted-foreground group-hover:text-accent-strong shrink-0 transition-colors"
                />
              </a>
            </div>
          </article>
        </div>
      }
    </hlm-tabs>
  </div>
</main>
