<header class="flex shrink-0 items-center gap-1 border-b p-2">
  <!--
    The sidebar is a sheet below `md`, so it needs one obvious way in. From `md` up the
    sidebar column is permanently on screen and its own header owns the toggle.
  -->
  <button hlmSidebarTrigger class="md:hidden" [srOnlyText]="'common.openNavMenu' | t"></button>

  <h1 class="flex min-w-0 flex-1 items-center gap-2 px-1 text-sm font-semibold">
    <app-icon name="policies" class="text-accent-strong text-[0.8125rem]" />
    <span class="min-w-0 truncate">{{ 'policies.title' | t }}</span>
  </h1>
</header>

<!--
  Two documents behind one pair of tabs, in a reading column: legal text at full window
  width is 200 characters a line and nobody reads it.

  `hlm-tabs` owns which one is showing; `activeTab` mirrors it so the component (and its
  spec) can still ask and set. The prose is styled with utilities on a wrapper rather
  than per element — one `[&_h3]:` rule beats a class on forty headings.
-->
<main class="min-h-0 flex-1 overflow-y-auto">
  <div class="mx-auto w-full max-w-3xl p-4 sm:p-6">
    <hlm-tabs [tab]="activeTab()" (tabActivated)="onTabActivated($event)">
      <hlm-tabs-list class="tab-nav w-full" [attr.aria-label]="'policies.title' | t">
        <button hlmTabsTrigger="terms" class="tab-button flex-1">{{ 'policies.termsTab' | t }}</button>
        <button hlmTabsTrigger="privacy" class="tab-button flex-1">{{ 'policies.privacyTab' | t }}</button>
      </hlm-tabs-list>

      <div hlmTabsContent="terms" class="tab-content">
        <div hlmCard class="mt-4">
          <div hlmCardHeader>
            <h2 hlmCardTitle class="text-base">{{ 'policies.termsTab' | t }}</h2>
          </div>

          <div hlmCardContent class="text-muted-foreground flex flex-col gap-4 text-sm leading-relaxed">
            <p>
              {{ 'policies.termsBody' | t }}
            </p>
            <p>
              {{ 'policies.linkPrefix' | t }}
              <a
                href="https://keeperpass.com/terms-of-service"
                target="_blank"
                rel="noopener"
                class="text-accent-strong font-semibold hover:underline"
                >keeperpass.com/terms-of-service</a
              >.
            </p>
          </div>
        </div>
      </div>

      <div hlmTabsContent="privacy" class="tab-content">
        <div hlmCard class="mt-4">
          <div hlmCardHeader>
            <h2 hlmCardTitle class="text-base">{{ 'policies.privacyTab' | t }}</h2>
          </div>

          <div hlmCardContent class="text-muted-foreground flex flex-col gap-4 text-sm leading-relaxed">
            <p>
              {{ 'policies.privacyBody' | t }}
            </p>
            <p>
              {{ 'policies.linkPrefix' | t }}
              <a
                href="https://keeperpass.com/privacy-policy"
                target="_blank"
                rel="noopener"
                class="text-accent-strong font-semibold hover:underline"
                >keeperpass.com/privacy-policy</a
              >.
            </p>
          </div>
        </div>
      </div>
    </hlm-tabs>
  </div>
</main>
