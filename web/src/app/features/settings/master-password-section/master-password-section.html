<h2 class="text-muted-foreground mb-2.5 px-1 text-xs font-bold tracking-wider uppercase">
  {{ 'settings.security' | t }}
</h2>

<div class="bg-card overflow-hidden rounded-2xl border shadow-xs">
  <div class="flex flex-col gap-4 p-5 sm:flex-row sm:items-center">
    <span
      class="bg-primary/15 text-accent-strong inline-flex size-10 shrink-0 items-center justify-center rounded-xl"
      aria-hidden="true"
    >
      <ng-icon name="lucideKeyRound" size="1.125rem" strokeWidth="1.75" />
    </span>

    <div class="min-w-0 flex-1">
      <p class="text-foreground text-sm font-bold">{{ 'settings.masterPassword.title' | t }}</p>
      <p class="text-muted-foreground mt-0.5 text-sm leading-relaxed">
        {{ 'settings.masterPassword.description' | t }}
      </p>
    </div>

    <button
      hlmBtn
      variant="outline"
      class="change-password h-10 shrink-0 gap-2 rounded-xl px-4 font-semibold"
      (click)="startChange()"
    >
      <ng-icon name="lucideLockKeyhole" size="1rem" strokeWidth="1.75" />
      {{ 'settings.masterPassword.change' | t }}
    </button>
  </div>
</div>

<app-change-password-dialog [(open)]="changing" />
