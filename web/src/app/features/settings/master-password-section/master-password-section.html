<div hlmCard>
  <div hlmCardHeader>
    <h2 hlmCardTitle class="text-base">{{ 'settings.masterPassword.title' | t }}</h2>
    <p hlmCardDescription>{{ 'settings.masterPassword.description' | t }}</p>
  </div>

  <div hlmCardContent>
    <button hlmBtn variant="outline" size="sm" class="change-password" (click)="startChange()">
      <app-icon name="lock" />
      {{ 'settings.masterPassword.change' | t }}
    </button>
  </div>
</div>

<app-change-password-dialog [(open)]="changing" />
