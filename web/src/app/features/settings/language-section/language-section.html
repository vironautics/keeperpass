<h2 class="text-muted-foreground mb-2.5 px-1 text-xs font-bold tracking-wider uppercase">
  {{ 'settings.language.title' | t }}
</h2>

<div class="bg-card overflow-hidden rounded-2xl border shadow-xs">
  <div class="flex flex-col gap-4 p-5 sm:flex-row sm:items-center">
    <span
      class="bg-primary/15 text-accent-strong inline-flex size-10 shrink-0 items-center justify-center rounded-xl"
      aria-hidden="true"
    >
      <ng-icon name="lucideLanguages" size="1.125rem" strokeWidth="1.75" />
    </span>

    <div class="min-w-0 flex-1">
      <label for="locale-select" class="text-foreground text-sm font-bold">
        {{ 'settings.language.label' | t }}
      </label>
      <p class="text-muted-foreground mt-0.5 text-sm leading-relaxed">
        {{ 'settings.language.hint' | t }}
      </p>
    </div>

    <!--
      `[itemToString]` because the value is a locale code: the trigger stringifies the
      value, and the options only exist while the panel is open, so a closed trigger
      would read "en" instead of "English".
    -->
    <hlm-select
      id="locale-select"
      class="locale-select shrink-0"
      [formControl]="control"
      [itemToString]="localeLabel"
    >
      <hlm-select-trigger class="bg-card h-10 w-full rounded-xl px-3.5 font-semibold sm:w-44">
        <hlm-select-value [placeholder]="'generator.language' | t" />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal class="rounded-xl">
        @for (option of localeOptions; track option.value) {
          <hlm-select-item [value]="option.value" class="h-9 rounded-lg">{{
            option.label
          }}</hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>
  </div>
</div>
