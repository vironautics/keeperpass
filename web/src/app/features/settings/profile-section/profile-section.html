<h2 class="text-muted-foreground mb-2.5 px-1 text-xs font-bold tracking-wider uppercase">
  {{ 'settings.profile.title' | t }}
</h2>

<div class="bg-card overflow-hidden rounded-2xl border shadow-xs">
  <div class="flex flex-col gap-4 p-5 sm:flex-row sm:items-center">
    <span
      class="bg-primary text-primary-foreground inline-flex size-14 shrink-0 items-center justify-center rounded-2xl text-lg font-extrabold"
      aria-hidden="true"
    >
      {{ initials() }}
    </span>

    <!--
      Read-only, and said out loud why: both values come from the account this session
      signed in with, and `UnlockPage` re-reads them on every unlock. An editable field
      here would have looked like it saved and then silently reverted.
    -->
    <dl class="flex min-w-0 flex-1 flex-col gap-0.5">
      <dt class="sr-only">{{ 'settings.profile.displayName' | t }}</dt>
      <dd class="profile-name text-foreground truncate text-lg font-extrabold tracking-tight">
        {{ name() || '—' }}
      </dd>
      <dt class="sr-only">{{ 'settings.profile.email' | t }}</dt>
      <dd class="profile-email text-muted-foreground truncate text-sm">{{ email() || '—' }}</dd>
    </dl>

    <button
      hlmBtn
      variant="outline"
      class="h-10 shrink-0 gap-2 rounded-xl px-4 font-semibold"
      (click)="logOut()"
    >
      <ng-icon name="lucideLogOut" size="1rem" strokeWidth="1.75" class="rtl:-scale-x-100" />
      {{ 'settings.profile.logOut' | t }}
    </button>
  </div>

  <p class="bg-muted/50 text-muted-foreground flex items-start gap-2 border-t px-5 py-3 text-xs leading-relaxed">
    <ng-icon name="lucideInfo" size="0.875rem" strokeWidth="2" class="mt-px shrink-0" />
    {{ 'settings.profile.managedByProvider' | t }}
  </p>
</div>
