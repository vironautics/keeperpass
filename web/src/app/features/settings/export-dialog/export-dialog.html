<hlm-dialog [state]="open() ? 'open' : 'closed'" (stateChanged)="open.set($event === 'open')">
  <hlm-dialog-content *hlmDialogPortal class="w-[min(28rem,calc(100vw-2rem))] gap-6 rounded-2xl sm:max-w-md" [attr.aria-label]="'settings.export.title' | t">
    <hlm-dialog-header class="gap-1.5">
      <span
        class="bg-primary/15 text-accent-strong ring-primary/25 mb-2 inline-flex size-12 items-center justify-center rounded-2xl ring-1"
        aria-hidden="true"
      >
        <ng-icon name="lucideDownload" size="1.375rem" strokeWidth="1.75" />
      </span>
      <h3 hlmDialogTitle class="text-lg font-bold">{{ 'settings.export.title' | t }}</h3>
      <p hlmDialogDescription>
        {{ 'settings.export.description' | t }}
      </p>
    </hlm-dialog-header>

    <hlm-field>
      <label hlmFieldLabel for="export-vault">{{ 'settings.export.sourceVaultLabel' | t }}</label>
      <hlm-select id="export-vault" [formControl]="vaultControl" [itemToString]="vaultLabel">
        <hlm-select-trigger class="bg-card h-11 w-full rounded-xl px-3.5">
          <hlm-select-value [placeholder]="'settings.export.allVaultsPlaceholder' | t" />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (option of vaultOptions(); track option.value) {
            <hlm-select-item [value]="option.value">{{ option.label }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </hlm-field>

    <!--
      Unconditional, because CSV is the only format: there is no combination of
      choices in this dialog that produces an encrypted file.

      Two columns by hand: see the note on the same alert in `start-page.html`.
    -->
    <div hlmAlert variant="destructive" class="grid-cols-[auto_1fr] gap-x-2.5! rounded-xl">
      <app-icon name="alert" class="translate-y-0.5" />
      <p hlmAlertTitle class="col-start-2">{{ 'settings.export.notEncryptedTitle' | t }}</p>
      <p hlmAlertDescription class="col-start-2">
        {{ 'settings.export.notEncryptedDescription' | t }}
      </p>
    </div>

    <hlm-dialog-footer class="gap-2">
      <button hlmBtn class="h-10 rounded-xl px-4 font-semibold" variant="outline" (click)="cancel()">{{ 'common.cancel' | t }}</button>
      <button hlmBtn class="confirm-export h-10 gap-2 rounded-xl px-4 font-bold" [disabled]="!canExport()" (click)="exportData()">
        <app-icon name="export" />
        {{ (itemCount() === 1 ? 'settings.export.exportOne' : 'settings.export.exportMany') | t: { count: itemCount() } }}
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
