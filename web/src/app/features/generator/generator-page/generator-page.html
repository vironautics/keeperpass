<!-- Same header shape as every other view: the mobile sidebar trigger, then the title. -->
<header class="bg-card flex h-14 shrink-0 items-center gap-3 border-b px-3 sm:px-6">
  <button
    hlmSidebarTrigger
    class="-ms-1 size-9 rounded-lg md:hidden"
    [srOnlyText]="'common.openNavMenu' | t"
  ></button>

  <span
    class="bg-primary/15 text-accent-strong inline-flex size-9 shrink-0 items-center justify-center rounded-xl"
    aria-hidden="true"
  >
    <ng-icon name="lucideWandSparkles" size="1.125rem" strokeWidth="1.75" />
  </span>

  <div class="flex min-w-0 flex-1 flex-col leading-tight">
    <h1 class="text-foreground truncate text-base font-extrabold tracking-tight">
      {{ 'generator.pageTitle' | t }}
    </h1>
    <p class="text-muted-foreground truncate text-xs max-sm:hidden">
      {{ 'generator.subtitle' | t }}
    </p>
  </div>
</header>

<!--
  A capped column rather than full-bleed — a generator is read one line at a time, and a
  150-character string across a 1440px page is not. The scroll container is the outer
  element so a tall panel on a short screen scrolls instead of being cut off.
-->
<main class="bg-background min-h-0 flex-1 overflow-y-auto">
  <div class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 sm:py-10">
    <app-generator-panel />
  </div>
</main>
