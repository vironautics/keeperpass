<!--
  spartan's `sidebar-inset` block: the wrapper is the flex row, the sidebar is one
  column, and whatever is projected here (an `<main hlmSidebarInset>`) is the other.
  `h-svh` rather than the block's `min-h-svh` because this app does not scroll the
  document — html/body are fixed, and each view manages its own overflow.
-->
<!--
  `collapsible="icon"` rather than the block's default `offcanvas`: the toggle is the
  one in the header below, so collapsing must leave it on screen. Offcanvas slides the
  whole column past the left edge, which would take the only way back with it.
-->
<div hlmSidebarWrapper class="h-svh min-h-0">
  <hlm-sidebar variant="inset" collapsible="icon">
    <hlm-sidebar-header>
      <ul hlmSidebarMenu>
        <li
          hlmSidebarMenuItem
          class="flex items-center group-data-[collapsible=icon]:justify-center"
        >
          <!--
            The brand mark is the wordmark, so it replaces the block's icon-square +
            name pair. It hides in the collapsed rail — a 5.3:1 wordmark has no square
            form to shrink into — which leaves the trigger alone, and centred.
          -->
          <a
            hlmSidebarMenuButton
            size="lg"
            routerLink="/items"
            class="flex-1 gap-2.5 group-data-[collapsible=icon]:hidden"
          >
            <!--
              The wordmark is ~5.3:1, so its width follows the height — at the stock
              3em it is wider than the whole sidebar column. 1.5em leaves room for the
              version beside it.
            -->
            <app-logo style="--logo-height: 1.5em" />
            <span
              class="bg-sidebar-foreground/[0.06] text-sidebar-foreground/60 rounded-full px-2 py-0.5 text-[0.625rem] font-bold tabular-nums"
              >v{{ version }}</span
            >
          </a>

          <!--
            The only sidebar toggle on a wide screen, and the only way to close the
            sheet on a narrow one besides the backdrop — spartan hides the sheet's own
            close button.
          -->
          <button hlmSidebarTrigger></button>
        </li>
      </ul>
    </hlm-sidebar-header>

    <!--
      One place for the navigation's look, so every group reads the same: helm's rows,
      a little taller and rounder; group labels as small caps captions; the current
      destination raised as a card with its icon in the accent; counts as quiet pills.
      Descendant variants rather than classes on each row, because there are dozens of
      rows across three components and they must not drift apart.
    -->
    <hlm-sidebar-content
      class="gap-1 [&_[data-sidebar=group-label]]:text-[0.6875rem] [&_[data-sidebar=group-label]]:font-bold [&_[data-sidebar=group-label]]:tracking-wider [&_[data-sidebar=group-label]]:text-sidebar-foreground/50 [&_[data-sidebar=group-label]]:uppercase [&_[data-sidebar=menu-button]]:h-9 [&_[data-sidebar=menu-button]]:gap-3 [&_[data-sidebar=menu-button]]:rounded-lg [&_[data-sidebar=menu-button]]:px-2.5 [&_[data-sidebar=menu-button]]:font-medium [&_[data-sidebar=menu-button]]:text-sidebar-foreground/80 [&_[data-sidebar=menu-button]:hover]:bg-sidebar-foreground/[0.05] [&_[data-sidebar=menu-button]:hover]:text-sidebar-foreground [&_[data-sidebar=menu-button][data-active=true]]:bg-card [&_[data-sidebar=menu-button][data-active=true]]:font-semibold [&_[data-sidebar=menu-button][data-active=true]]:text-foreground [&_[data-sidebar=menu-button][data-active=true]]:shadow-xs [&_[data-sidebar=menu-button][data-active=true]]:ring-1 [&_[data-sidebar=menu-button][data-active=true]]:ring-sidebar-border [&_[data-sidebar=menu-button][data-active=true]_ng-icon]:text-accent-strong [&_[data-sidebar=menu-sub-button]]:h-8 [&_[data-sidebar=menu-sub-button]]:rounded-lg [&_[data-sidebar=menu-sub-button]]:px-2.5 [&_[data-sidebar=menu-sub-button]]:text-sidebar-foreground/75 [&_[data-sidebar=menu-sub-button]:hover]:bg-sidebar-foreground/[0.05] [&_[data-sidebar=menu-sub-button][data-active=true]]:bg-card [&_[data-sidebar=menu-sub-button][data-active=true]]:font-semibold [&_[data-sidebar=menu-sub-button][data-active=true]]:text-foreground [&_[data-sidebar=menu-sub-button][data-active=true]]:shadow-xs [&_[data-sidebar=menu-sub-button][data-active=true]]:ring-1 [&_[data-sidebar=menu-sub-button][data-active=true]]:ring-sidebar-border [&_[data-sidebar=menu-badge]]:end-1.5 [&_[data-sidebar=menu-badge]]:rounded-full [&_[data-sidebar=menu-badge]]:bg-sidebar-foreground/[0.06] [&_[data-sidebar=menu-badge]]:px-1.5 [&_[data-sidebar=menu-badge]]:text-[0.6875rem] [&_[data-sidebar=menu-badge]]:font-semibold [&_[data-sidebar=menu-badge]]:text-sidebar-foreground/70 [&_[data-sidebar=menu-sub]]:border-sidebar-foreground/10 [&_[data-sidebar=menu-sub]]:my-0.5"
    >
      <app-nav-vaults />
      <app-nav-more />
    </hlm-sidebar-content>

    <hlm-sidebar-footer>
      <app-nav-user
        (lockRequested)="lockRequested.emit()"
        (signOutRequested)="signOutRequested.emit()"
      />
    </hlm-sidebar-footer>
  </hlm-sidebar>

  <ng-content />
</div>
