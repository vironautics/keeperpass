name: Publish Extension to Firefox Add-ons

# Manual only, deliberately — this submits a real, reviewable version to
# addons.mozilla.org. Bump `extention/public/manifest.json`'s `version` first
# (AMO rejects a re-upload of a version number it's already seen), then run
# this from the Actions tab.
#
# Signing/submission uses Mozilla's own `web-ext sign` CLI (package `web-ext`,
# v8+, which talks to the AMO submission API). There is no real
# `mozilla-actions/sign-addon` GitHub Action — don't reintroduce that name.
# `mozilla/sign-addon` is a related Mozilla package but it's archived and has
# no action.yml, so it can't be used via `uses:` either.
#
# Credentials: https://addons.mozilla.org/developers/addon/api/key/ gives you
# a JWT issuer and JWT secret. Add them as repo secrets:
#   AMO_JWT_ISSUER
#   AMO_JWT_SECRET
#
# AMO requires "categories", "summary", and a "license" on an add-on's
# first-ever listed version (confirmed against Mozilla's own web-ext docs:
# https://extensionworkshop.com/documentation/develop/getting-started-with-web-ext/#submitting-your-add-on).
# All three are reused automatically on every later version, so this only
# matters once. --amo-metadata supplies them:
#   - "AGPL-3.0-only" is the predefined license slug AMO's API expects for
#     this project's license (full list:
#     https://mozilla.github.io/addons-server/topics/api/licenses.html).
#   - "privacy-security" is AMO's category slug for a password manager
#     (full list: https://mozilla.github.io/addons-server/topics/api/categories.html).
#   - "summary" must be set explicitly here — unlike "name", AMO does not
#     derive it from manifest.json's description.
#
# --approval-timeout=0 stops the sign command from blocking on AMO's review
# (which can take anywhere from minutes to a few days per their own emails)
# — without it, `web-ext sign` waits up to 15 minutes then fails the job
# with a timeout even though the submission itself went through fine.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extention/package-lock.json

      - name: Install dependencies
        working-directory: extention
        run: npm ci

      - name: Build Firefox package
        working-directory: extention
        run: npm run build:mozilla

      - name: Write AMO metadata
        working-directory: extention
        run: |
          cat > amo-metadata.json <<'EOF'
          {
            "categories": {
              "firefox": ["privacy-security"]
            },
            "summary": {
              "en-US": "Browser extension for KeeperPass password manager"
            },
            "version": {
              "license": "AGPL-3.0-only"
            }
          }
          EOF

      - name: Sign and submit to AMO
        working-directory: extention
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir=dist/extention/firefox \
            --channel=listed \
            --amo-metadata=amo-metadata.json \
            --approval-timeout=0
