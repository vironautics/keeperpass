name: Publish Extension to Firefox Add-ons

# Manual only, deliberately — this submits a real, reviewable version to
# addons.mozilla.org. Bump `extention/public/manifest.json`'s `version` first
# (AMO rejects a re-upload of a version number it's already seen), then run
# this from the Actions tab.
#
# Signing/submission uses Mozilla's own `web-ext sign` CLI (package `web-ext`,
# v8+, which talks to the AMO submission API). There is no real
# `mozilla-actions/sign-addon` GitHub Action — don't reintroduce that name.
# `mozilla/sign-addon` is a related Mozilla package but it's archived and has
# no action.yml, so it can't be used via `uses:` either.
#
# Credentials: https://addons.mozilla.org/developers/addon/api/key/ gives you
# a JWT issuer and JWT secret. Add them as repo secrets:
#   AMO_JWT_ISSUER
#   AMO_JWT_SECRET
#
# AMO requires a license on an add-on's first-ever listed version (later
# versions reuse whatever was set on the first one, so this only matters
# once). --amo-metadata supplies it; "AGPL-3.0-only" is the predefined
# license slug AMO's API expects for this project's license — see
# https://mozilla.github.io/addons-server/topics/api/licenses.html for the
# full list if that ever needs to change.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extention/package-lock.json

      - name: Install dependencies
        working-directory: extention
        run: npm ci

      - name: Build Firefox package
        working-directory: extention
        run: npm run build:mozilla

      - name: Write AMO metadata
        working-directory: extention
        run: |
          cat > amo-metadata.json <<'EOF'
          {
            "version": {
              "license": "AGPL-3.0-only"
            }
          }
          EOF

      - name: Sign and submit to AMO
        working-directory: extention
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir=dist/extention/firefox \
            --channel=listed \
            --amo-metadata=amo-metadata.json
