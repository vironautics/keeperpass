services:
    web:
        image: ghcr.io/vironautics/keeperpass/web:latest
        container_name: keeperpass-web
        restart: always
        ports:
            - "80"
        networks:
            - keeperpass-network

    welcome:
        image: ghcr.io/vironautics/keeperpass/welcome:latest
        container_name: keeperpass-welcome
        restart: always
        ports:
            - "80"
        networks:
            - keeperpass-network

networks:
    keeperpass-network:
        driver: bridge
